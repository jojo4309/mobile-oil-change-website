# ============================================================
# Deploy the static site to GitHub Pages — fully automatic.
# Runs on every push to the default branch. The configure-pages
# step (enablement: true) turns on GitHub Pages the first time,
# so no manual Settings toggle is required.
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/mobile-oil-change-site-e2hvui"]
  workflow_dispatch:

# Permissions needed for the Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
